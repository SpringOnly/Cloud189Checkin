name: 仓库保活

on:
  workflow_dispatch:
  schedule:
    # 每月 1 号 08:00（北京时间）
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          date -u +'%Y-%m-%d %H:%M:%S UTC' > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive" || exit 0
          git push
