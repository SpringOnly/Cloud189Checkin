name: 天翼云盘签到

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 10:35
    - cron: "35 2 * * *"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 恢复登录缓存
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: c189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: |
            c189-token-

      - name: 执行签到
        env:
          TY_USERNAME_1: ${{ secrets.TY_USERNAME_1 }}
          TY_PASSWORD_1: ${{ secrets.TY_PASSWORD_1 }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          ok=0
          for i in 1 2 3; do
            npm start && ok=1 && break
            echo "第 $i 次执行失败，30 秒后重试"
            sleep 30
          done
          [ "$ok" = "1" ] || exit 1

      - name: 计算缓存标识
        id: token
        if: always()
        run: |
          HASH=$(find .token -name '*.json' -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: 保存登录缓存
        if: always() && steps.token.outputs.hash != ''
        uses: actions/cache/save@v4
        with:
          path: .token
          key: c189-token-${{ steps.token.outputs.hash }}
